<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CodeTrad — Traducteur de code</title>
        <link rel="stylesheet" href="style.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Syne:wght@400;600;700;800&display=swap"
            rel="stylesheet"
        />
        <!-- Monaco Editor Loader -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    </head>
    <body>
        <div class="bg-grid" aria-hidden="true"></div>
        <div class="bg-glow" aria-hidden="true"></div>

        <header class="header">
            <div class="header__logo">
                <span class="logo-icon">⟨/⟩</span>
                <span class="logo-text">CodeTrad</span>
                <span class="logo-badge">BETA</span>
            </div>
            <nav class="header__nav">
                <a href="#" class="nav-link active">Traducteur</a>
            </nav>
        </header>

        <main class="workspace">
            <div class="controls-bar">
                <div class="lang-selector">
                    <label class="lang-label">Source</label>
                    <div class="select-wrapper">
                        <select id="lang-source" class="select">
                            <option value="python">Python</option>
                            <option value="javascript">JavaScript</option>
                            <option value="typescript">TypeScript</option>
                            <option value="java">Java</option>
                            <option value="csharp">C#</option>
                            <option value="cpp">C++</option>
                            <option value="go">Go</option>
                            <option value="rust">Rust</option>
                            <option value="php">PHP</option>
                            <option value="ruby">Ruby</option>
                        </select>
                        <span class="select-icon">▾</span>
                    </div>
                </div>

                <button
                    class="btn-translate"
                    id="btn-translate"
                    title="Traduire (Ctrl+Enter)"
                >
                    <span class="translate-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L14.5 9.5L22 12L14.5 14.5L12 22L9.5 14.5L2 12L9.5 9.5L12 2Z"/></svg></span>
                    <span class="translate-label">Traduire</span>
                    <span class="translate-shortcut">Ctrl+↵</span>
                </button>

                <div class="lang-selector">
                    <label class="lang-label">Cible</label>
                    <div class="select-wrapper">
                        <select id="lang-target" class="select">
                            <option value="javascript">JavaScript</option>
                            <option value="python">Python</option>
                            <option value="typescript">TypeScript</option>
                            <option value="java">Java</option>
                            <option value="csharp">C#</option>
                            <option value="cpp">C++</option>
                            <option value="go">Go</option>
                            <option value="rust">Rust</option>
                            <option value="php">PHP</option>
                            <option value="ruby">Ruby</option>
                        </select>
                        <span class="select-icon">▾</span>
                    </div>
                </div>

                <div class="controls-right">
                    <button
                        class="btn btn--ghost btn--icon"
                        id="btn-swap"
                        title="Inverser les langages"
                    >
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path d="M7 16V4m0 0L3 8m4-4 4 4" />
                            <path d="M17 8v12m0 0 4-4m-4 4-4-4" />
                        </svg>
                    </button>
                    <button
                        class="btn btn--ghost btn--icon"
                        id="btn-clear"
                        title="Effacer"
                    >
                        <svg
                            width="16"
                            height="16"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                            />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="editors-grid">
                <!-- Panel Source -->
                <div class="editor-panel" id="panel-source">
                    <div class="panel-header">
                        <div class="panel-header__left">
                            <span class="panel-dot panel-dot--source"></span>
                            <span class="panel-title" id="label-source"
                                >Python</span
                            >
                            <span class="panel-tag">Source</span>
                        </div>
                        <div class="panel-header__right">
                            <button
                                class="icon-btn"
                                id="btn-copy-source"
                                title="Copier"
                            >
                                <svg
                                    width="14"
                                    height="14"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <rect
                                        x="9"
                                        y="9"
                                        width="13"
                                        height="13"
                                        rx="2"
                                    />
                                    <path
                                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                                    />
                                </svg>
                            </button>
                            <button
                                class="icon-btn"
                                id="btn-upload"
                                title="Charger un fichier"
                            >
                                <svg
                                    width="14"
                                    height="14"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                                    />
                                    <polyline points="17 8 12 3 7 8" />
                                    <line x1="12" y1="3" x2="12" y2="15" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="editor-container" id="editor-source-monaco"></div>
                    <div class="panel-footer">
                        <span class="footer-info" id="source-lines"
                            >0 lignes</span
                        >
                        <span class="footer-info" id="source-chars"
                            >0 caractères</span
                        >
                    </div>
                </div>

                <div class="editor-divider" aria-hidden="true"></div>

                <!-- Panel Target -->
                <div class="editor-panel" id="panel-target">
                    <div class="panel-header">
                        <div class="panel-header__left">
                            <span class="panel-dot panel-dot--target"></span>
                            <span class="panel-title" id="label-target"
                                >JavaScript</span
                            >
                            <span class="panel-tag">Résultat</span>
                        </div>
                        <div class="panel-header__right">
                            <span
                                class="status-badge"
                                id="translate-status"
                            ></span>
                            <button
                                class="icon-btn"
                                id="btn-copy-target"
                                title="Copier le résultat"
                            >
                                <svg
                                    width="14"
                                    height="14"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <rect
                                        x="9"
                                        y="9"
                                        width="13"
                                        height="13"
                                        rx="2"
                                    />
                                    <path
                                        d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                                    />
                                </svg>
                            </button>
                            <button
                                class="icon-btn"
                                id="btn-save-file"
                                title="Copier le code traduit dans un fichier"
                            >
                                <svg
                                    width="14"
                                    height="14"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
                                    />
                                    <path d="M7 10l5 5 5-5" />
                                    <line x1="12" y1="15" x2="12" y2="3" />
                                </svg>
                            </button>
                            <button
                                class="icon-btn"
                                id="btn-download"
                                title="Télécharger"
                            >
                                <svg
                                    width="14"
                                    height="14"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                >
                                    <path
                                        d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"
                                    />
                                    <path d="M14 2v5h5" />
                                    <path d="M9 13h6" />
                                    <path d="M9 17h6" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="editor-container result-container">
                        <div class="editor-placeholder" id="editor-placeholder">
                            <div class="placeholder-icon">⟨/⟩</div>
                            <p class="placeholder-text">
                                Le code traduit apparaîtra ici
                            </p>
                            <p class="placeholder-hint">
                                Colle du code à gauche et clique sur
                                <strong>Traduire</strong>
                            </p>
                        </div>
                        <div id="editor-target-monaco" style="height: 100%; display: none;"></div>
                    </div>
                    <div class="panel-footer">
                        <span class="footer-info" id="target-lines">—</span>
                        <span class="footer-info" id="target-chars">—</span>
                    </div>
                </div>
            </div>

            <div class="details-panel" id="details-panel">
                <button
                    class="details-resizer"
                    id="details-resizer"
                    type="button"
                    aria-label="Redimensionner le panneau d'explication"
                ></button>
                <div class="details-body">
                    <div class="details-section">
                        <p class="details-label">Explication</p>
                        <p
                            class="details-explanation"
                            id="details-explanation"
                        ></p>
                    </div>
                    <div class="details-section">
                        <p class="details-label">Pièges courants</p>
                        <ul class="details-pitfalls" id="details-pitfalls"></ul>
                    </div>
                </div>
            </div>

            <div class="status-bar">
                <span class="status-bar__item" id="status-msg"
                    >Prêt — colle ton code et clique Traduire</span
                >
                <span class="status-bar__item status-bar__item--right"
                    >CodeTrad v0.1.0</span
                >
            </div>
        </main>

        <div class="toast" id="toast" role="alert" aria-live="polite"></div>
        <input
            type="file"
            id="file-input"
            accept=".py,.js,.ts,.java,.cs,.cpp,.go,.rs,.php,.rb,.txt"
            style="display: none"
        />

        <script src="app.js"></script>
    </body>
</html>
